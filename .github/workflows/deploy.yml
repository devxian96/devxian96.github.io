# devxian96.github.io 배포
#
# GitHub Pages는 정적 파일만 서빙하므로 next.config.ts가 `output: 'export'`로
# out/ 디렉토리를 통째로 뽑아낸다. buzzle-landing처럼 서버에 이미지를 보내는
# 단계가 없고, 빌드 산출물을 Pages 아티팩트로 올리는 것으로 끝난다.
#
# 게이트는 buzzle 규칙 그대로다 — lint → type-check → build 순으로 돌고,
# 하나라도 실패하면 배포하지 않는다.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# 배포가 겹치면 나중 것이 먼저 끝나 예전 빌드가 최종본이 될 수 있다.
# cancel-in-progress: false — 진행 중인 배포는 끝까지 마치게 둔다.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm type-check

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Build
              run: pnpm build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
